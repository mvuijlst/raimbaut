# nginx site for raimbaut.yusupov.cloud — reference copy of
#   /etc/nginx/sites-available/raimbaut-yusupov   (on ssh alias "yusupov")
# Serves site/_site (as extracted by deploy.ps1) straight from disk, same pattern
# as atelier.yusupov.cloud. Replaces the earlier setup, a proxy to
# `python3 -m http.server` on :8020 (raimbaut-yusupov.service), which could not
# compress CSS/JS, send cache headers, or serve a real 404 page.
#
# Install:  copy over the file above, then  nginx -t && systemctl reload nginx
# The "managed by Certbot" lines are certbot's; keep them as they are on the server.

server {
    server_name raimbaut.yusupov.cloud;

    root /home/django/raimbaut-yusupov;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/raimbaut.yusupov.cloud.access.log;
    error_log  /var/log/nginx/raimbaut.yusupov.cloud.error.log warn;

    error_page 404 /404.html;

    # text/html is always compressed; nginx.conf leaves the rest commented out
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # add_header is not inherited into a location that has its own add_header,
    # so the security headers are repeated in each location.

    # HTML: always revalidate (cheap 304s), so a deploy is visible at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Pagefind's search bundle: fixed file names that change with every reindex, so
    # never the year-long cache below. (^~ stops the regex locations from matching.)
    location ^~ /pagefind/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS/JS are referenced as file?v=<content hash> (the `bust` filter in
    # site/eleventy.config.js); fonts only ever change by being renamed
    location ~* \.(css|js|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # photographs: stable, but not fingerprinted — a month, then revalidate.
    # (matched by extension: /manuscrits/ is also the Table des manuscrits page)
    location ~* \.(jpe?g|png|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/raimbaut.yusupov.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/raimbaut.yusupov.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = raimbaut.yusupov.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name raimbaut.yusupov.cloud;
    return 404; # managed by Certbot


}
